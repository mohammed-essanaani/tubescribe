name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,build]"

      - name: Test
        run: pytest

      - name: Build executable
        run: pyinstaller tubescribe.spec --clean --noconfirm

      - name: Smoke test
        shell: pwsh
        run: |
          ./dist/TubeScribe.exe --version
          ./dist/TubeScribe.exe get --help | Out-Null

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TubeScribe.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TubeScribe.exe" | Out-File -Encoding ascii dist/TubeScribe.exe.sha256
          Get-Content dist/TubeScribe.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: TubeScribe-windows
          path: dist/TubeScribe.exe*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TubeScribe.exe
            dist/TubeScribe.exe.sha256
          generate_release_notes: true
          body: |
            Download `TubeScribe.exe` and run it. The app opens in your browser.

            The exe is not code-signed, so Windows SmartScreen may show a warning (More info > Run anyway).
