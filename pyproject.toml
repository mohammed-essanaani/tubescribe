[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubescribe"
dynamic = ["version"]
description = "YouTube transcript extractor with a web UI and CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Essanaani" }]
requires-python = ">=3.10"
keywords = ["youtube", "transcript", "captions", "subtitles", "yt-dlp", "multilingual", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
]
dependencies = [
    "yt-dlp>=2025.1.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
build = ["pyinstaller>=6.5"]

[project.scripts]
tubescribe = "tubescribe.cli:main"

[project.urls]
Homepage = "https://github.com/mohammed-essanaani/tubescribe"
Issues = "https://github.com/mohammed-essanaani/tubescribe/issues"

[tool.setuptools.dynamic]
version = { attr = "tubescribe.__version__" }

[tool.setuptools.packages.find]
include = ["tubescribe*"]

[tool.setuptools.package-data]
tubescribe = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with:Warning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]
